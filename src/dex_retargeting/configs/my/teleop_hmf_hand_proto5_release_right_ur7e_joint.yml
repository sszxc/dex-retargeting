  viewer_camera:
    lookat: [0.0, 0.6, 0.6]
    azimuth: 30
    elevation: -30
    distance: 2.0
  control_rate_hz: 60.0
  mocap:
    wrist_mocap: true
    mocap_body_name: mocap
    mocap_id: null
  assist_near_object:
